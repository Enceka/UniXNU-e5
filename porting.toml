inputs = ["kernel.macho from CI, hardware.dtb, ADT with root volume UUID, packed APFS seed ramdisk, trust cache (cdhash list), E5BootMenu, DarwinBoot, UniXNU.efi and startup.nsh on a 56 MiB FAT payload."]
configuration = ["make-e5-payload.py assembles the payload FAT; mk-boot-payload.py wraps BootShim plus SILICIUM_UEFI.fd plus payload into the 62,926,860-byte boot image flashed to boot_b at LBA 8.", "The trust cache must be rebuilt whenever any seed binary is rebuilt (ad-hoc cdhashes change every build).", "The ADT root volume UUID and board.toml root_match_volume_uuid must track the APFS seed container UUID."]
