[[area]]
id = "display"
status = "device-verified"
components = ["GopFramebuffer"]
paths = ["package/*Framebuffer*", "package/*Display*"]
inputs = ["ST7365P 320x480 RGB565 panel driven from LK; UEFI GOP from the inherited framebuffer; XNU boot_args Video hand-off."]
configuration = ["SprdGopDxe publishes the 320x480 16-bpp GOP inherited from LK; the E5 menu renders through the official UniXNUPkg menu library.", "DarwinBoot sets Video v_display to 0 so XNU uses the text-mode console and maps the framebuffer from Video base 0xBE000000, rowBytes 640, depth 16.", "e5-fbconsole patch: write to fd 230 (and mirrors of fd 1/2) lazily acquires the video console (vc_e5_acquire, gc_enable) and renders through vcputc; an E5FB serial mirror tags every rendered line."]
procedure = ["Boot the payload, wait for the seed shell, and read the E5FB lines from the collected report while watching the panel.", "Run the E5KINIT read-back from the matrix keypad for the keypad-side sanity values."]
findings = ["Screen output after the XNU hand-off is verified on device: the shell banner and E5 prompt render on the panel and mirror to serial (30 E5FB lines per boot across four reproducible flashes).", "kPETextMode with a zero v_display was required; with serial=3 the UART stays the kernel printf console while vcputc renders to the framebuffer."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Backlight control and userland presentation are not implemented; only the kernel text console path is verified."]
next_action = ["Add a GOP brightness/backlight path and exercise userland CoreGraphics against the framebuffer."]

