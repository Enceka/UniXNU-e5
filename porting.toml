schema_version = 1

[device]
name = "e5"
soc = "UMS9621"
os_profile = "ipados-17.7.11-21H461"
summary = "Rongyue E5 is a 5G senior bar phone (feature-phone form factor) with a removable battery, a 3.5-inch 320x480 ST7365P RGB565 panel, 2 GiB RAM, eMMC and a Unisoc UMS9621 (Qogirn6Lite) SoC with 2x Cortex-A76 plus 6x Cortex-A55. The record covers the BootROM-FDL-LK-BootShim-mu UEFI chain, XNU hand-off, framebuffer console, matrix keypad input, seed userland and the read-only eMMC block service."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "RamBlock"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["UMS9621 SoC feed, iPadOS 17.7.11 build 21H461 OS profile, XNU 10063.141.1 source pin, device defconfig."]
configuration = ["board.name = e5; board.soc = UMS9621; board.soc_source = ums9621; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "kernel.defconfig = e5_defconfig; patch_series applies arch, soc, os then device series.", "Device kernel archives add e5_emmc_build.py (NativeEmmc IOKit storage driver), RamBlock with virtio-mmio bindings, e5_derive_audit.py storage ABI audit from the pinned kernelcache IPSW, SoftwareAES bindings and mockfs fixture."]
procedure = ["Run ./unixnu defconfig e5_defconfig --device <repo> from the UniXNU checkout.", "Run ./unixnu status --json --device <repo> and confirm profiles, source pins and patch order.", "CI (kernel-builder workflow) builds kernel.macho from the pinned sources on a macOS runner."]
findings = ["Arrays replace inherited selections in board.toml; the device list restates every required component.", "CI rebuilds from identical patch content are not byte-identical; kernel behaviour was validated by flash evidence instead of binary hashes.", "Patches must be generated against the arch+soc+os-patched tree; anchors against pristine Apple XNU fail where UniXNU series modify the same files (for example arm_init.c gains boot_progress helpers)."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Kernel binary layout is fragile: rebuilds with patch deltas beyond the validated series can die before the kernel console starts (observed in flashes 20, 21, 23, 27, 28); the mechanism is unresolved."]
next_action = ["Keep the validated patch series pinned until the pre-console fragility is understood; document any new patch with its flash evidence."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Configuration and archives described in this section"

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["docs/**", "tools/**"]
inputs = ["Vendor LK bootloader on the B slot, BootShim raw payload stub, mu-based UEFI firmware (Silicium e5Pkg), DarwinBoot EFI loader, payload FAT volume."]
configuration = ["Boot chain: BootROM to FDL to LK to BootShim to UEFI (4 MiB SILICIUM_UEFI.fd) to UEFI Shell (startup.nsh) to E5BootMenu.", "B slot boots the payload (misc slot record: B priority 15, A Android fallback 14); watchdog 300 s reboots failed boots.", "BootManagerLib launches the Shell through an E5 protocol (GUID 9A48E983-AB52-4043-828C-5366DCDADB26) resolved by LocateProtocol at TPL_APPLICATION because DXE event queues never drain without timer interrupts."]
procedure = ["Build the firmware and payload with uefi/build-e5.sh, make-e5-payload.py and mk-boot-payload.py in the e5-xnu repository.", "Flash with tools/e5-uefi-cycle.sh flash (writes boot_b payload at LBA 8 plus the misc slot record).", "Collect logs with tools/e5-uefi-cycle.sh collect (Android pstore ramoops zones survive the reboot)."]
findings = ["UEFI timer interrupts are not delivered (GIC delivery unconfirmed), so the UniXNU menu counts down by polling and UEFI event notifications at or below the current TPL never dispatch.", "AON registers are clock-gated: the keypad and AON GPIO banks need set-mirror clock writes (0x64901004, 0x64901018) before any register access or the AXI bus wedges.", "The Shell must be started from PlatformBootManagerAfterConsole via a direct protocol call; a signalling event queues forever without timer ticks."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["GIC timer delivery in UEFI is still broken; countdown and Shell launch work around it with polling and direct protocol calls."]
next_action = ["Root-cause the missing UEFI timer interrupt through GIC distributor/CPU-interface state dumps."]

