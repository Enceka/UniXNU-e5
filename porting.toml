[[area]]
id = "input"
status = "implemented"
components = []
paths = ["package/*Button*", "patches/xnu/e5-keys.patch"]
inputs = ["sprd,sc9860-keypad matrix controller at 0x641B0000 (4 rows by 7 cols, KEY_STATUS event slots), AON GPIO bank 7 pin 15 volume-down (active low), PMIC EIC volume-up and power keys."]
configuration = ["UEFI: E5BootMenu installs a SimpleTextIn merge (keypad first, chained serial ConIn) on a vendor-path handle so the official UniXNU menu counts it; countdown stops on the first key.", "XNU: the seed shell reads /dev/console (canonical tty fed by the serial keyboard thread); the e5-keys patch exposes the matrix keypad through read of fd 230 gated by the e5-keys boot-arg."]
procedure = ["Watch the menu stop its countdown on a physical key press and navigate with arrows and select.", "Boot the seed and type through the serial console into the on-screen shell."]
findings = ["The keypad block reads sane values in XNU (E5KINIT 000f7f030000000077777777: CTRL rows/cols enables correct, KEY_STATUS idle pattern) even though its caller is unconfirmed.", "Boot-args containing e5-key tokens deterministically kill the kernel before the console starts, and any e5-keys.patch content delta beyond the validated series does the same token-free; kernel-side physical keys stay blocked by the binary fragility documented in the configuration area.", "The /dev/console input path is fully working (open, canonical line editing, serial keyboard thread feed); only the keypad-to-cons_cinput bridge is missing."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["Touch panel is absent (bar phone keypad input only). Kernel-side keypad feed is blocked by the kernel binary fragility; UEFI menu input works."]
next_action = ["Once the pre-console fragility is fixed, feed the matrix keypad into cons_cinput from the console poll path and repeat the on-device acceptance."]

