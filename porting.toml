result = "Full chain observed on device: LK boots BootShim, UEFI menu renders, DarwinBoot loads kernel.macho 52035584 bytes with trust cache Success, XNU reaches the seed root and PID 1 shell."

[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["dts/**", "package/**"]
inputs = ["8 CPUs: cluster0 cpu@0 to cpu@500 are Cortex-A55, cluster1 cpu@600 and cpu@700 are Cortex-A76 (capacity-dmips-mhz 420 vs 1024 in the vendor live device tree); PSCI 0.2 enable-method; GICv3."]
configuration = ["PSCI 0.2 CPU_ON/SYSTEM_OFF used by BootShim and DarwinBoot; XNU boots with the UniXNU ArmCpu/ArmDTPlatform components.", "XNU kernel timers run (clock_gettime and ITIMER_REAL wakeups verified from the seed clock binary); UEFI-periodic timers do not (see firmware area)."]
procedure = ["Compare dumps/live-fdt.dts cpu nodes for cluster layout and capacities.", "Boot XNU and read the E5UL uplink clock test lines (GTOD, ITIMER, WAITING-ALRM)."]
findings = ["cpu@600/cpu@700 capacity 0x400 against 0x1a4 for cpu@0 to cpu@500 confirms the 2x A76 plus 6x A55 Qogirn6Lite layout.", "XNU schedules and delivers interval timers on the boot CPU; secondary-core bring-up inside XNU has not been measured yet."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer and IPI handling works on each enabled CPU."]
limits = ["Enabled-core coverage inside XNU and IPI delivery across clusters are not yet measured."]
next_action = ["Instrument XNU CPU_START paths per core and record which of the 8 cores come online."]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Memory*"]
inputs = ["2 GiB DRAM starting at 0x80000000; vendor reserved regions from the live device tree; kernel, ADT, ramdisk and boot-args staging windows."]
configuration = ["DarwinBoot stages kernel at physical 0xC407C000 (virtual 0xFFFFFFF00427C000), boot-args at 0xC81A0000 and the packed seed ramdisk below 0xC821C000.", "PE_init_platform copies boot_args Video fields; Video v_display is forced to 0 so XNU picks the text-mode console and maps the framebuffer itself."]
procedure = ["Read the DarwinBoot staging debug lines (kernel va/pa, args address, video base) from a collected report.", "Verify the APFS seed volume mounts from the ramdisk (E5SEED volume UUID in board.toml)."]
findings = ["The packed ramdisk growth from 291040 to 467184 bytes shifted the staging top by 0x2C000 without affecting boot; staging is size-independent within the reserved window.", "Memory ownership hand-off follows the boot_args ABI of XNU 10063.141.1 (struct sizes 0x480 verified against pexpert/arm64/boot.h)."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["SMMU is not configured; DMA uses coherently-mapped buffers with explicit cache maintenance."]
next_action = ["Document the reserved-memory map end to end (LK, UEFI, XNU) in one table with dump references."]

[[area]]
id = "storage"
status = "implemented"
components = ["RamBlock"]
paths = ["scripts/emmc/**", "scripts/*ufs*", "tools/userspace/**"]
inputs = ["Unisoc SDHCI host controller at 0x41000000 window (warm-inherited from LK: card selected in TRAN state, RCA 1), eMMC 29 GiB with a 70-entry GPT, cache partition at LBA 0xd0a800 size 0x200000 sectors, full disk mmcblk0."]
configuration = ["NativeEmmc (scripts/emmc/NativeEmmc.cpp) is compiled into the kernel by e5_emmc_build.py against the storage ABI derived from the pinned kernelcache.", "v2-v4 probes: identity (CMD0/CMD2/CMD9/CMD13), warm CMD17 reads, EXT_CSD, LBA0/LBA1 CRC references, boot_b and misc read-back verification against host-flashed bytes.", "v5 publishes the whole-disk IOBlockStorageDevice (61079552 sectors) with a locked synchronous read path; the XnuPrelink IOStorageFamily attaches, GUIDPartitionScheme re-parses the GPT and publishes 70 partition medias.", "v6/v6.1 add a second cache-window block device (base LBA 0xd0a800) started from a kernel publisher thread so AppleAPFSFilter can claim a bare APFS container written to the cache partition."]
procedure = ["Write a bare APFS container to the cache partition from Android (dd to /dev/block/mmcblk0p47) and verify the NXSB survives warm reboots.", "Patch the ADT root UUID to the container volume UUID, point board.toml root_match_volume_uuid at it, rebuild the payload and flash.", "Read the NativeEmmc elog markers (inherit lines, v4 result, part enumeration, publishing, rw calls) from the collected report."]
findings = ["GPT entries-array writes are deterministically restored by the boot chain (LK validates and rebuilds the canonical GPT), so partition-type GUID edits are not a viable root-matching path; partition-data writes persist.", "IOStorageFamily attaches to the whole-disk device published from a standard matched start(); a second manually-created block device registered from inside the parent start() gets zero client matches, and starting it from a kernel publisher thread is required (ShengUfs publishThread pattern).", "All IOKit reads through doAsyncReadWrite succeed (trace shows single and 32-block reads at LBA 0, 1, 2 with no failures), so the read path is verified end to end on device.", "The cache-window volume is not yet claimed: with the root UUID pointed at the eMMC container the kernel waits for IOMedia UUID 36E07D3C-7F6F-40B0-B714-E0025D0118C6, times out and panics in IOKitBSDInit mountroot."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Read-only: no write path yet. Root volume still boots from the ramdisk seed; the eMMC APFS container is not claimed by the family yet (flash 52 evidence).", "Writes to the GPT area do not survive reboot (restored by LK); partition-content writes do."]
next_action = ["Publish the cache window with a GPT-wrapped APFS container image (mirroring the ramdisk seed layout that already works through GUIDPartitionScheme) and retest root matching on eMMC."]

